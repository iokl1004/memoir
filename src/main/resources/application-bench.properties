# 검색 성능 측정용 프로필: 개발 DB와 분리된 bench DB(3307)를 쓰고, 미리보기 서버(8080)와 겹치지 않게 8081에서 떠요.
# 실행: ./gradlew bootRun --args='--spring.profiles.active=bench'
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:mysql://localhost:3307/memoir
spring.datasource.username=memoir
spring.datasource.password=memoir
server.port=8081
