# 배포 서버용 설정. SPRING_PROFILES_ACTIVE=prod 로 켜요(Dockerfile이 켜 둬요).
# 비밀 값(DB 패스워드, 메일 앱 비밀번호, 캡차 키)은 여기에 적지 않고 모두 환경 변수로 넣어요(deploy/.env).

# DB: deploy/compose.yaml이 SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD를 넣어요.
spring.datasource.hikari.maximum-pool-size=10

# 메일 속 링크의 주소. 배포 주소가 없으면 시작하지 않아요(localhost 링크가 메일로 나가지 않게).
memoir.app-url=${APP_URL}

# HTTPS 뒤에서만 쓰니, 로그인 쿠키는 HTTPS로만 보내고 다른 사이트에서 온 요청에는 붙지 않게 해요.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# 오류 응답에 서버 내부 정보(스택 등)가 나가지 않게 해요.
server.error.include-stacktrace=never
server.error.include-exception=false

logging.level.root=INFO
logging.level.com.iokl1004.memoir=INFO
