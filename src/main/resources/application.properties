spring.application.name=memoir

# 스키마는 Flyway가 관리하고, JPA는 엔티티와 테이블이 맞는지 검증만 해요.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 에러 응답을 표준 형식(RFC 9457 ProblemDetail)으로 통일해요.
spring.mvc.problemdetails.enabled=true

# 메모에 붙여넣는 그림은 한 장에 5MB까지예요.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 패스워드 찾기 메일. 메일 서버는 환경 변수로만 넣어요(README 참고). 없으면 링크를 로그에 남겨요.
memoir.app-url=${APP_URL:http://localhost:5173}
memoir.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# 로그인 캡차(Cloudflare Turnstile). 기본값은 Cloudflare가 주는 테스트 키(항상 통과)예요. 실제 키는 환경 변수로 넣어요.
memoir.captcha.site-key=${CAPTCHA_SITE_KEY:1x00000000000000000000AA}
memoir.captcha.secret-key=${CAPTCHA_SECRET_KEY:1x0000000000000000000000000000000AA}

# 세션 테이블은 Flyway(V6)가 만들어요.
spring.session.jdbc.initialize-schema=never

# 배포에서 프록시(Nginx 등) 뒤에 있어도 X-Forwarded-For로 진짜 접속 주소를 알아요.
# 로그인 시도 제한이 주소별로 세기 때문에, 이게 없으면 모든 사용자가 프록시 주소 하나로 묶여요. (내부망 프록시만 믿어요)
server.forward-headers-strategy=native
