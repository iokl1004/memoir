name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 화면 (린트, 단위 테스트, 빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: DB·함수 (로컬 Supabase 통합 테스트)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # 러너의 Docker로 Supabase(DB, Auth, Storage, Edge Functions)를 띄우고 마이그레이션을 적용해요.
      - run: npx --yes supabase@3.2.0 start -x studio,imgproxy,vector,logflare,realtime,supavisor
      - run: npm ci
        working-directory: frontend
      - run: npm run test:db
        working-directory: frontend
