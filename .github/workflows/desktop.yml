name: PC 앱

# 태그(v1.0.0)를 푸시하면 Windows 설치 파일을 만들어 GitHub Releases에 올려요.
# 손으로 돌리면(workflow_dispatch) 만들기만 하고 Actions 결과물(artifact)로 남겨요.
# 태그 번호는 desktop/src-tauri/tauri.conf.json, Cargo.toml의 version과 같게 맞춰요.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 빌드는 읽기 권한만. 쓰기 권한은 아래 release 작업에만 줘요.
permissions:
  contents: read

jobs:
  build:
    name: Windows 설치 파일
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      # 외부 액션은 내용이 바뀌지 않게 커밋 번호로 고정해요. 올릴 때는 새 번호를 확인해 바꿔요.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 태그 번호와 앱 버전이 다르면 설치 파일 안의 버전과 릴리스 이름이 어긋나서 멈춰요.
      - name: 버전 확인
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($conf -ne $cargo) { throw "tauri.conf.json($conf)과 Cargo.toml($cargo) 버전이 달라요" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$conf") { throw "태그 $env:GITHUB_REF_NAME 와 앱 버전 v$conf 가 달라요" }
      # Cargo.lock이 저장소에 있으면 그 버전으로만 받아요(--locked). 없으면 새로 만들어 결과물에 담아요.
      - name: 빌드
        shell: pwsh
        run: |
          $runner = if (Test-Path src-tauri/Cargo.lock) { @('--', '--locked') } else { @() }
          npx --yes @tauri-apps/cli@2.12.6 build --bundles nsis @runner
      # 홈페이지 버튼이 항상 같은 주소(releases/latest/download/memoir-setup.exe)를 가리키게 이름을 고정해요.
      - name: 파일 이름 고정
        shell: pwsh
        run: Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName memoir-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: memoir-setup
          path: |
            desktop/memoir-setup.exe
            desktop/src-tauri/Cargo.lock

  release:
    name: 릴리스에 올리기
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memoir-setup
      # 태그 이름은 명령어에 바로 끼우지 않고 환경 변수로 넘겨요.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha=$(sha256sum memoir-setup.exe | cut -d' ' -f1)
          gh release create "$TAG" memoir-setup.exe src-tauri/Cargo.lock --repo "$GITHUB_REPOSITORY" --title "memoir PC 앱 $TAG" \
            --notes "Windows 10/11용 설치 파일이에요. 처음 실행할 때 'Windows의 PC 보호' 창이 뜨면 '추가 정보 → 실행'을 눌러 주세요.

          SHA-256: \`$sha\`"
